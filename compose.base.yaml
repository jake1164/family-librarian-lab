services:
  postgres:
    profiles: [base]
    image: ${FAMILY_LIBRARIAN_POSTGRES_IMAGE:-postgres:17.6-alpine}
    environment:
      POSTGRES_DB: family_librarian
      POSTGRES_USER: family_librarian
      POSTGRES_PASSWORD: ${FAMILY_LIBRARIAN_POSTGRES_PASSWORD:?Set FAMILY_LIBRARIAN_POSTGRES_PASSWORD in lab.env}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U family_librarian -d family_librarian"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    volumes:
      - postgres-data:/var/lib/postgresql/data

  migrate:
    profiles: [base]
    build:
      context: ${FAMILY_LIBRARIAN_SOURCE_DIR:?Set FAMILY_LIBRARIAN_SOURCE_DIR in lab.env}
      target: final
    image: ${FAMILY_LIBRARIAN_IMAGE:-family-librarian-lab:dev}
    command: ["--migrate"]
    environment:
      ConnectionStrings__FamilyLibrarian: Host=postgres;Port=5432;Database=family_librarian;Username=family_librarian;Password=${FAMILY_LIBRARIAN_POSTGRES_PASSWORD:?Set FAMILY_LIBRARIAN_POSTGRES_PASSWORD in lab.env}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  clamav:
    # Own profile, deliberately never included alongside `base`: ClamAV's
    # virus database never changes between cases (nothing writes to it; the
    # two scanner-outage fault cases stop/start the process via
    # stop_service()/start_service(), never a full compose cycle), so it is
    # brought up once per suite (see ensure_shared_clamav() in commands.py)
    # instead of torn down and rebuilt for every case. Published to the host
    # rather than joined to each case's own per-case Compose network/project,
    # since a case's project is intentionally short-lived and uniquely named
    # per run -- host.docker.internal is a stable address every case's
    # family-librarian container can already reach without new network
    # plumbing.
    profiles: [shared-clamav]
    platform: linux/amd64
    image: ${FAMILY_LIBRARIAN_CLAMAV_IMAGE:-clamav/clamav:1.4}
    ports:
      - "${FAMILY_LIBRARIAN_CLAMAV_HOST_PORT:-13310}:3310"
    environment:
      CLAMD_CONF_StreamMaxLength: 600M
      CLAMD_CONF_MaxFileSize: 600M
      CLAMD_CONF_PCREMaxFileSize: 600M
      CLAMD_CONF_MaxScanSize: 1000M
      CLAMD_CONF_AlertExceedsMax: "yes"
    healthcheck:
      test: ["CMD", "clamdscan", "--ping", "1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 180s
    volumes:
      - clamav-data:/var/lib/clamav

  family-librarian:
    profiles: [base]
    build:
      context: ${FAMILY_LIBRARIAN_SOURCE_DIR:?Set FAMILY_LIBRARIAN_SOURCE_DIR in lab.env}
      target: final
    image: ${FAMILY_LIBRARIAN_IMAGE:-family-librarian-lab:dev}
    ports:
      - "${FAMILY_LIBRARIAN_HOST_PORT:-18080}:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__FamilyLibrarian=Host=postgres;Port=5432;Database=family_librarian;Username=family_librarian;Password=${FAMILY_LIBRARIAN_POSTGRES_PASSWORD:?Set FAMILY_LIBRARIAN_POSTGRES_PASSWORD in lab.env}
      - MetadataProviders__OpenLibrary__ContactEmail=${FAMILY_LIBRARIAN_OPENLIBRARY_CONTACT_EMAIL:-}
      - MetadataProviders__OpenLibrary__RequestsPerSecond=${FAMILY_LIBRARIAN_OPENLIBRARY_REQUESTS_PER_SECOND:-1}
      - MetadataProviders__GoogleBooks__Enabled=${FAMILY_LIBRARIAN_GOOGLE_BOOKS_ENABLED:-false}
      - MetadataProviders__GoogleBooks__ApiKey=${FAMILY_LIBRARIAN_GOOGLE_BOOKS_API_KEY:-}
      - ADMIN_EMAIL=${FAMILY_LIBRARIAN_ADMIN_EMAIL:?Set FAMILY_LIBRARIAN_ADMIN_EMAIL in lab.env}
      - ADMIN_PASSWORD=${FAMILY_LIBRARIAN_ADMIN_PASSWORD:?Set FAMILY_LIBRARIAN_ADMIN_PASSWORD in lab.env}
      - Invitations__LifetimeDays=${FAMILY_LIBRARIAN_INVITATIONS_LIFETIME_DAYS:-7}
      - Invitations__RedemptionAttemptsPerMinute=${FAMILY_LIBRARIAN_INVITATIONS_REDEMPTION_ATTEMPTS_PER_MINUTE:-10}
      - Storage__RootPath=/data/family-librarian
      # Overridden per-scenario to lab-host-gateway/the published host port
      # when a suite's shared ClamAV (see the `clamav` service above) is in
      # play -- see ensure_shared_clamav()/`_BaseScenario`'s extra_env in
      # commands.py. Defaults still work for anyone running `docker compose`
      # against this file directly with the old-style `base` profile only.
      - ClamAv__Host=${FAMILY_LIBRARIAN_CLAMAV_HOST:-clamav}
      - ClamAv__Port=${FAMILY_LIBRARIAN_CLAMAV_PORT:-3310}
      # Bare passthrough (no `=value`): Compose only sets these inside the
      # container when the named variable is actually present in whatever
      # environment `docker compose` itself was invoked with (see
      # family_librarian_lab.commands._compose()). Every existing suite's
      # `extra_env` never sets any of these, so the app falls back to its own
      # real compiled-in defaults (real gutenberg.org URLs, no SSL_CERT_FILE)
      # completely unaffected -- only the gutenberg suite's own
      # ensure_gutenberg_fixture_tls() sets them, scenario-scoped, never a
      # blanket override in this file. A `=value` form with an empty default
      # here would instead set SSL_CERT_FILE="" for every other suite,
      # replacing the app's normal trust store with nothing.
      - GutenbergCatalog__ArchiveUrl
      - GutenbergCatalog__RecentUpdatesFeedUrl
      - GutenbergCatalog__EbookRdfBaseUrl
      - GutenbergCatalog__MinimumBookCount
      - SSL_CERT_FILE
    # A deliberately non-reserved name, not "host.docker.internal": Docker
    # Desktop already special-cases that literal name with its own built-in
    # DNS entry, which on this Mac resolves to an IPv6 address that is not
    # actually routable from a project's bridge network ("Network is
    # unreachable", confirmed for real) -- an extra_hosts entry for that same
    # reserved name did not win over Docker's own resolution. A name Docker
    # has no built-in opinion about only ever resolves via this entry, so
    # host-gateway (the real IPv4 gateway of this container's own network,
    # Docker Engine 20.10+) is what actually gets used, on this Mac and on
    # Linux (toontown-int-srv2) alike.
    extra_hosts:
      - "lab-host-gateway:host-gateway"
    healthcheck:
      test:
        - CMD
        - bash
        - -c
        - 'exec 3<>/dev/tcp/127.0.0.1/8080 && printf "GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n" >&3 && head -n 1 <&3 | grep -q " 200 "'
      interval: 3s
      timeout: 5s
      retries: 30
      start_period: 5s
    volumes:
      - family-librarian-data:/data/family-librarian
      # Always mounted, even when neither client profile is active: harmless
      # (an unused, unread volume) and keeps this one image usable for
      # cwa-local without a separate compose file, matching what --profile
      # brings up.
      - cwa-ingest:/cwa-ingest
      # Always mounted (same "harmless when unused" pattern as cwa-ingest
      # above): an empty placeholder file for every suite but gutenberg (see
      # _load_lab_env()'s ensure_gutenberg_ca_bundle_placeholder()), the real
      # combined CA bundle -- the container's own real trust store plus the
      # lab's self-signed CA -- only when ensure_gutenberg_fixture_tls() has
      # written one and SSL_CERT_FILE (above) points the app at this path.
      - ${FAMILY_LIBRARIAN_GUTENBERG_CA_BUNDLE:-./runtime/gutenberg-tls/ca-bundle.pem}:/etc/ssl/lab-gutenberg-ca-bundle.pem:ro
      # Same pattern, independent CA/bundle/mount, for the smtp suite's own
      # fixture SMTP server (see ensure_smtp_fixture_tls() in commands.py).
      # SmtpSecurityMode has no plaintext option -- every real SMTP send,
      # including the happy path, negotiates STARTTLS and validates the
      # server's certificate, so this must exist before that suite can prove
      # anything. Kept separate from the gutenberg bundle above (not merged
      # into one file) so the two suites' own SSL_CERT_FILE overrides never
      # need to agree on a shared bundle -- only one suite is ever active in
      # a given scenario, so there's no real benefit to merging them.
      - ${FAMILY_LIBRARIAN_SMTP_CA_BUNDLE:-./runtime/smtp-tls/ca-bundle.pem}:/etc/ssl/lab-smtp-ca-bundle.pem:ro
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      # No clamav entry: it's a separate, suite-shared container outside this
      # project now (see the `clamav` service comment above), so Compose has
      # no dependency to express here. family-librarian's own /health/ready
      # already includes SecurityScannerHealthCheck, so the harness's
      # readiness poll still correctly waits for real ClamAV reachability.

  cwa:
    profiles: [cwa-local, cwa-sftp-key, cwa-sftp-password]
    image: ${FAMILY_LIBRARIAN_CWA_IMAGE:-crocodilestick/calibre-web-automated:latest}
    environment:
      # Matches family-librarian's own non-root app user (the .NET base
      # image's built-in $APP_UID) so both containers can write into the
      # shared cwa-ingest volume -- a mismatch here fails LocalCwaIngestTransport
      # with "Access to the path ... is denied." (confirmed for real).
      PUID: 1654
      PGID: 1654
      TZ: Etc/UTC
    ports:
      - "${FAMILY_LIBRARIAN_CWA_HOST_PORT:-18083}:8083"
    volumes:
      - cwa-config:/config
      - cwa-library:/calibre-library
      # Same named volume family-librarian writes into above -- this is the
      # shared ingest transport CWA-L-02 exercises, not two separate copies.
      - cwa-ingest:/cwa-book-ingest

  abs:
    profiles: [abs]
    image: ${FAMILY_LIBRARIAN_ABS_IMAGE:-advplyr/audiobookshelf:latest}
    # A failed client request must not leave the audiobook library unavailable.
    restart: unless-stopped
    ports:
      - "${FAMILY_LIBRARIAN_ABS_HOST_PORT:-18378}:80"
    # advplyr/audiobookshelf bakes no HEALTHCHECK into its image (confirmed:
    # `docker inspect ... Config.Healthcheck` is null), unlike CWA's image.
    # Without one, _wait_for_service()'s "state==running and health in
    # (healthy, empty-string)" check accepts the container the instant the
    # process starts -- not once the Node server inside is actually serving.
    # ABS restarts in two distinct boot phases roughly 35s apart (confirmed
    # via its own logs: two "=== Starting Server ===" blocks per restart);
    # a request landing in that gap gets a raw connection reset (ABS-06's
    # "[Errno 104] Connection reset by peer" failure, root-caused 2026-08-26).
    # AbsClient.ready() (clients.py) already proves /healthcheck is the right
    # endpoint -- reuse it here instead of guessing a new one. wget, not curl:
    # confirmed present in the image, curl is not.
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80/healthcheck"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 60s
    volumes:
      - abs-config:/config
      - abs-metadata:/metadata
      - abs-audiobooks:/audiobooks

  # Both sftp-* services write into the SAME cwa-ingest volume `cwa` already
  # mounts at /cwa-book-ingest for cwa-local -- a file that arrives via SFTP
  # becomes visible to CWA's importer no differently than one written
  # directly, matching the design doc's "CWA sees the same backing ingest
  # volume" topology. Only one of these two profiles is active per run, so
  # the shared chroot upload subdir is never written by both at once. No host
  # port: Family Librarian reaches these over the Compose network by service
  # name, and there is no manual-testing need to reach them from the host.
  sftp-key:
    profiles: [cwa-sftp-key]
    image: ${FAMILY_LIBRARIAN_SFTP_IMAGE:-atmoz/sftp:alpine}
    volumes:
      - cwa-ingest:/home/cwaftp/upload
      - ${FAMILY_LIBRARIAN_SFTP_KEY_DIR:?Set FAMILY_LIBRARIAN_SFTP_KEY_DIR in lab.env}:/home/cwaftp/.ssh/keys:ro
      # atmoz/sftp only chowns a home subdirectory when IT creates it; a
      # pre-existing Docker-volume mount point at the same path (cwa-ingest,
      # shared with `cwa`) stays root-owned, so writes fail "Permission
      # denied" without this (confirmed for real against a live container).
      - ./docker/sftp/fix-ingest-permissions.sh:/etc/sftp.d/fix-ingest-permissions.sh:ro
    # Empty password field disables password auth for this user, relying
    # solely on the mounted public key -- atmoz/sftp's documented syntax for
    # key-only accounts. uid:gid match CWA's own PUID/PGID (see `cwa` above).
    command: cwaftp::1654:1654:upload

  sftp-password:
    profiles: [cwa-sftp-password]
    image: ${FAMILY_LIBRARIAN_SFTP_IMAGE:-atmoz/sftp:alpine}
    volumes:
      - cwa-ingest:/home/cwaftp/upload
      - ./docker/sftp/fix-ingest-permissions.sh:/etc/sftp.d/fix-ingest-permissions.sh:ro
    command: cwaftp:${FAMILY_LIBRARIAN_SFTP_PASSWORD:?Set FAMILY_LIBRARIAN_SFTP_PASSWORD in lab.env}:1654:1654:upload

  # Serves the gutenberg suite's fixture archive/feed over HTTPS -- the real
  # GutenbergCatalogOptions/GutenbergMirrorOptions validate every configured
  # URL as absolute HTTPS at DI startup, no plain-HTTP path exists (confirmed
  # against real code). ensure_gutenberg_fixture_tls() (commands.py)
  # generates the self-signed cert this serves and the document root it
  # mounts read-only; family-librarian trusts it via the CA-bundle mount and
  # SSL_CERT_FILE described on that service above.
  gutenberg-fixture:
    profiles: [gutenberg]
    image: ${FAMILY_LIBRARIAN_NGINX_IMAGE:-nginx:alpine}
    volumes:
      # Defaults, not required (`:?`): Compose interpolates every service's
      # variables for any invocation against this file, regardless of which
      # profile is actually active (confirmed for real -- a required var
      # here broke the unrelated shared-clamav bring-up, which never
      # requests the gutenberg profile at all). These defaults match
      # GUTENBERG_FIXTURE_ROOT/GUTENBERG_TLS_DIR in commands.py; only
      # ensure_gutenberg_fixture_tls() ever populates real content at them.
      - ${FAMILY_LIBRARIAN_GUTENBERG_FIXTURE_ROOT:-./runtime/gutenberg-fixture-root}:/usr/share/nginx/html:ro
      - ${FAMILY_LIBRARIAN_GUTENBERG_TLS_DIR:-./runtime/gutenberg-tls}/server.pem:/etc/nginx/ssl/server.pem:ro
      - ${FAMILY_LIBRARIAN_GUTENBERG_TLS_DIR:-./runtime/gutenberg-tls}/server.key:/etc/nginx/ssl/server.key:ro
      - ./docker/gutenberg/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      # 127.0.0.1, not "localhost": BusyBox wget resolves "localhost" to ::1
      # first, and nginx's `listen 443 ssl;` only binds IPv4 by default --
      # "Connection refused" on the healthcheck despite nginx actually being
      # up (confirmed for real; same IPv6-preference class of issue as the
      # host.docker.internal fix above).
      test: ["CMD", "wget", "--no-check-certificate", "--no-verbose", "--tries=1", "--spider", "https://127.0.0.1/today.rss"]
      interval: 3s
      timeout: 5s
      retries: 20
      start_period: 5s

  # Real, disposable SMTP server for the smtp suite -- family-librarian's own
  # test suite never exercises MailKitSmtpTestSender for real (it's stubbed
  # out for every in-repo test), so this is the only place that proves the
  # actual connect/STARTTLS/authenticate/send path works. SMTP AUTH is
  # required and checked against docker/mailpit/smtp-auth-file (bcrypt; the
  # only way to get a real, deterministic auth failure out of the app rather
  # than faking one) -- see clients.SMTP_AUTH_USERNAME/_PASSWORD, which must
  # match. TLS is not optional either: SmtpSecurityMode has no plaintext
  # option, so even the happy-path case negotiates real STARTTLS against the
  # cert ensure_smtp_fixture_tls() issues (commands.py) -- Mailpit's own SMTP
  # server only supports STARTTLS, not a separate implicit-TLS listener, so
  # SmtpSecurityMode.SslOnConnect remains unproven by this suite.
  mailpit:
    profiles: [smtp]
    image: ${FAMILY_LIBRARIAN_MAILPIT_IMAGE:-axllent/mailpit:latest}
    environment:
      MP_SMTP_AUTH_FILE: /data/smtp-auth-file
      MP_SMTP_TLS_CERT: /data/server.pem
      MP_SMTP_TLS_KEY: /data/server.key
    ports:
      # Only Mailpit's own HTTP API/UI is published -- that's how the lab's
      # Python client independently verifies delivery (MailpitClient in
      # clients.py), the same "assert against the real destination's own
      # API" pattern AbsClient/CwaClient already use. The SMTP port itself
      # needs no host port: family-librarian reaches it over the Compose
      # network by service name, same as cwa/abs.
      - "${FAMILY_LIBRARIAN_SMTP_HOST_PORT:-18025}:8025"
    volumes:
      - ./docker/mailpit/smtp-auth-file:/data/smtp-auth-file:ro
      # Defaults, not required (`:?`): same "every invocation interpolates
      # every service's variables regardless of active profile" reasoning as
      # the gutenberg-fixture service's volumes above. Only
      # ensure_smtp_fixture_tls() ever populates real content at these paths.
      - ${FAMILY_LIBRARIAN_SMTP_TLS_DIR:-./runtime/smtp-tls}/server.pem:/data/server.pem:ro
      - ${FAMILY_LIBRARIAN_SMTP_TLS_DIR:-./runtime/smtp-tls}/server.key:/data/server.key:ro
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 3s
      timeout: 5s
      retries: 20
      start_period: 5s

volumes:
  postgres-data:
  clamav-data:
  family-librarian-data:
  cwa-ingest:
  cwa-config:
  cwa-library:
  abs-config:
  abs-metadata:
  abs-audiobooks:
