            source_kind: secondary
            evidence: "Position 3.5, 'Short Stories' and 29 Sep from OverDrive's catalogue record; collection and 'not the next in the series' from the author via trade press; the author's page gives no number; the publisher page dates it 16 Nov."
            verified_on: "2026-11-16"
            confidence: medium
