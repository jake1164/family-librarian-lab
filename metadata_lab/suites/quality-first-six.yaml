  - id: p08-threshing-day
    tier: medium
    tags: [first-six, work_type, forbid, freshness]
    description: "Threshing Day is a 2026 collection of thirteen stories in the Empyrean world, catalogued as Empyrean 3.5 and not main novel number 4."
    reference:
      source: "https://rebeccayarros.com/threshing-day (\"Thirteen unforgettable stories\"; Series: Empyrean, Secret Project), https://lunch.publishersmarketplace.com/2026/07/forthcoming-yarross-next-fourth-wing-book-is-called-threshing-day/ (trade press quoting the author: \"not the next in the series, but a collection of stories\"; release 29 September) and https://www.entangledpublishing.com/books/threshing-day (publisher page: Release Date November 16, 2026) and https://www.overdrive.com/media/13223405/threshing-day (distributor catalogue: The Empyrean #3.5, Short Stories, 29 September 2026)"
      verified_on: "2026-11-16"
      confidence: medium
    input:
      series: "The Empyrean"
      title: "Fourth Wing"
      author: "Rebecca Yarros"
    operations: [series_members]
    notes:
      - "WP5 re-verification 2026-11-16, corrected the same day. Deliberate changes: (1) published gains an accepted alternative; (2) work_type and the forbids cite the author's site, trade press and a distributor catalogue instead of Open Library and Wikipedia; (3) the series position 3.5 stays, now on separate catalogue evidence (see next note)."
      - "Position 3.5, two views kept apart. CATALOGUE: OverDrive lists the title in 'The Empyrean' as '#3.5 in series' (page https://www.overdrive.com/media/13223405/threshing-day, read 2026-11-16), and the owner independently verified the same record's structured readingOrder field, which the fetch of the rendered page could not show. AUTHOR/PUBLISHER: the author's site gives the series line 'Empyrean, Secret Project' with no number, and the author is quoted saying the book is 'not the next in the series'. These do not contradict each other: 3.5 is a catalogue reading order, and the author/publisher state no number. The catalogue value is therefore scored (accepted 3.5, medium confidence, source_kind secondary, upstream overlap with the providers not established) and does NOT supersede the author's classification, which is kept as the 'no main-line number' reading: a provider with no position for Threshing Day is omitted, not wrong, and 'Book 4' stays forbidden."
      - "An earlier version of this fixture and of its verification notes said 3.5 came only from Open Library. That was wrong and is corrected here."
      - "Legitimate ambiguity kept: the release date. OverDrive's record gives 29 September 2026, as do trade press and a retailer; the publisher's own product page says 'Release Date: November 16, 2026' (the same date sits on its Fourth Wing page with blank ISBN and page fields, so it may be a placeholder); the author's site says 'Available now!' without a date. Both dates are accepted. Confidence is medium for the member: three sources agree on 29 September, the publisher page disagrees."
      - "work_type collection: the author's page says 'Thirteen unforgettable stories'; OverDrive's subject is 'Short Stories'; the word 'collection' is the author's, quoted by Publishers Lunch from her Instagram post (not fetched). 'Wing and Claw Collection' appears only on retailer titles, never on the author's or publisher's pages, so it is an alias, not evidence of the work type."
      - "Unverifiable here: the first edition's format, and the imprint 'Red Tower Books' (retailers only; the publisher page names no imprint; OverDrive names Entangled Publishing, LLC)."
    expect:
      series_members:
        series: "The Empyrean"
        fact_type: time_sensitive
        source: "https://rebeccayarros.com/threshing-day (Series: Empyrean, Secret Project)"
        source_kind: primary
